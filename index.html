<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKid Quiz!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul class="background-shapes">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    <div id="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="lang-selector">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-id" class="lang-btn">ID</button>
            </div>
            <h1 class="logo">Brainy<span>Kid</span>!</h1>
            <p id="t-subtitle" class="subtitle">Are you ready to test your knowledge?</p>
            <button id="start-btn" class="btn primary-btn pulse"><span id="t-startBtn">Play Now!</span></button>
        </div>

        <!-- Class Selection Screen -->
        <div id="class-screen" class="screen">
            <h2 id="t-chooseClass">Choose Your Class</h2>
            <div class="class-grid">
                <button class="class-btn" data-class="1"><span id="t-class1">Class 1</span></button>
                <button class="class-btn" data-class="2"><span id="t-class2">Class 2</span></button>
                <button class="class-btn" data-class="3"><span id="t-class3">Class 3</span></button>
                <button class="class-btn" data-class="4"><span id="t-class4">Class 4</span></button>
                <button class="class-btn" data-class="5"><span id="t-class5">Class 5</span></button>
                <button class="class-btn" data-class="6"><span id="t-class6">Class 6</span></button>
            </div>
            <button id="back-to-start-from-class" class="btn secondary-btn small"><span id="t-backClass">Back</span></button>
        </div>

        <!-- Subject Selection Screen -->
        <div id="subject-screen" class="screen">
            <h2 id="t-chooseSubject">Choose Your Subject</h2>
            <div class="subject-grid">
                <button class="subject-btn math" data-subject="math">
                    <span class="icon">🔢</span> <span id="t-subjMath">Math</span>
                </button>
                <button class="subject-btn indo" data-subject="indo">
                    <span class="icon">🇮🇩</span> <span id="t-subjIndo">Bahasa Indonesia</span>
                </button>
                <button class="subject-btn english" data-subject="english">
                    <span class="icon">🇬🇧</span> <span id="t-subjEnglish">English</span>
                </button>
                <button class="subject-btn general" data-subject="general">
                    <span class="icon">👩‍🚀</span> <span id="t-subjGeneral">Professions</span>
                </button>
            </div>
            <button id="back-to-class" class="btn secondary-btn small"><span id="t-backSubject">Back</span></button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <button id="quit-quiz-btn" class="btn secondary-btn" style="margin:0; padding: 0.5rem; border-radius: 10px; font-size: 1rem;">❌ Quit</button>
                <div class="score-display"><span id="t-score">Score: </span><span id="current-score">0</span></div>
                <div class="timer">
                    <div class="timer-circle">
                        <span id="time-left">20</span>
                    </div>
                </div>
                <div class="question-tracker"><span id="t-question">Question </span><span id="current-q-num">1</span>/<span id="total-q-num">10</span></div>
            </div>
            <div class="question-container">
                <h2 id="question-text">Question goes here...</h2>
            </div>
            <div class="options-grid">
                <button class="option-btn opt-red" data-index="0"><span class="shape">▲</span><span class="opt-text">Option 1</span></button>
                <button class="option-btn opt-blue" data-index="1"><span class="shape">◆</span><span class="opt-text">Option 2</span></button>
                <button class="option-btn opt-yellow" data-index="2"><span class="shape">●</span><span class="opt-text">Option 3</span></button>
                <button class="option-btn opt-green" data-index="3"><span class="shape">■</span><span class="opt-text">Option 4</span></button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2 id="t-quizComplete">Quiz Complete!</h2>
            <div class="final-score-box">
                <p id="t-finalScoreTitle">Your Final Score</p>
                <h1 id="final-score">0</h1>
                <p style="color: #666; font-size: 1.2rem; margin-top: 5px; font-weight: bold;">/ 100</p>
            </div>
            <p id="feedback-message">Great Job!</p>
            <div class="result-actions">
                <button id="play-again-btn" class="btn primary-btn pulse"><span id="t-playAgain">Play Again</span></button>
                <button id="home-btn" class="btn secondary-btn"><span id="t-mainMenu">Main Menu</span></button>
            </div>
        </div>
    </div>
    
    <!-- Audio Elements for Sound Effects & Music -->
    <audio id="correct-sound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_cowbell_bell.ogg"></audio>
    <audio id="wrong-sound" src="https://actions.google.com/sounds/v1/cartoon/slip.ogg"></audio>
    <audio id="main-bgm" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=fun-life-112188.mp3" loop></audio>
    <audio id="quiz-bgm" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_2731804b90.mp3?filename=upbeat-fun-game-loop-8153.mp3" loop></audio>

    <script src="app.js"></script>
</body>
</html>
